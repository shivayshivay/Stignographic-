name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Name of the zip file committed at the repo root, and the folder name
  # it unzips to (both are "StegoForensics..." by default).
  PROJECT_ZIP: StegoForensics-android-project.zip
  PROJECT_DIR: StegoForensics

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip project (repo stores it as a .zip, not extracted)
        run: |
          if [ -d "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Project already extracted at $PROJECT_DIR, skipping unzip."
          elif [ -f "$PROJECT_ZIP" ]; then
            echo "Extracting $PROJECT_ZIP ..."
            unzip -o "$PROJECT_ZIP" -d .
          else
            echo "::error::Neither $PROJECT_DIR/ nor $PROJECT_ZIP were found in the repo root."
            exit 1
          fi
          echo "---- contents of $PROJECT_DIR ----"
          find "$PROJECT_DIR" -maxdepth 2 -not -path '*/.git*' | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This project ships without a Gradle wrapper jar (it's a binary file
      # and couldn't be generated in an offline environment), so this action
      # installs Gradle directly and caches it between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stego-forensics-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip project (repo stores it as a .zip, not extracted)
        run: |
          if [ -d "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Project already extracted at $PROJECT_DIR, skipping unzip."
          elif [ -f "$PROJECT_ZIP" ]; then
            unzip -o "$PROJECT_ZIP" -d .
          else
            echo "::error::Neither $PROJECT_DIR/ nor $PROJECT_ZIP were found in the repo root."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build unsigned release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: stego-forensics-release-unsigned-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
