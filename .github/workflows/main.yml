name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This project ships without a Gradle wrapper jar (it's a binary file
      # and couldn't be generated in an offline environment), so this action
      # installs Gradle directly and caches it between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stego-forensics-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: stego-forensics-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
